name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable SHA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy approved production release
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://signal.jisung.lol
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned host key
        env:
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Configure SSH key
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/production_ed25519"
          chmod 600 "$HOME/.ssh/production_ed25519"

      - name: Log in to GHCR on production host
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i "$HOME/.ssh/production_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Copy deployment configuration
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh_target="$PRODUCTION_USER@$PRODUCTION_HOST"
          ssh -i "$HOME/.ssh/production_ed25519" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$ssh_target" \
            'install -d -m 750 /opt/signal-archive'
          scp -i "$HOME/.ssh/production_ed25519" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes compose.production.yaml Caddyfile \
            "$ssh_target:/opt/signal-archive/"
          scp -i "$HOME/.ssh/production_ed25519" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes .github/scripts/deploy-production.sh \
            "$ssh_target:/opt/signal-archive/deploy-production.sh"

      - name: Migrate, roll out, and verify HTTPS
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh -i "$HOME/.ssh/production_ed25519" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "chmod 750 /opt/signal-archive/deploy-production.sh && \
             /opt/signal-archive/deploy-production.sh '${{ env.IMAGE_TAG }}' '${{ env.IMAGE_PREFIX }}'"
